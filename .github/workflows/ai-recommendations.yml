name: AI Recommendations
on:
  schedule:
    # Run at 00:00 on Monday every week
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-recommendations:
    name: Generate AI PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: read
    strategy:
      fail-fast: false
      matrix:
        scope: ['content', 'aesthetics', 'libraries']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Recommendation Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Node 18+ includes native fetch, no dependencies needed
          node .github/scripts/ai-recommender.js ${{ matrix.scope }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: AI Recommended Updates for ${{ matrix.scope }}"
          branch: "ai-recommendation-${{ matrix.scope }}"
          delete-branch: true
          title: "🤖 AI Recommendations: ${{ matrix.scope }} updates"
          body: |
            This PR contains automated AI-driven recommendations targeting the project's **${{ matrix.scope }}**.
            Please review the changes closely as AI-generated modifications may include hallucinations or breaking changes.
            
            _Generated by the AI Recommendation Cron Job._
          labels: "automated, ai-recommendation, ${{ matrix.scope }}"
